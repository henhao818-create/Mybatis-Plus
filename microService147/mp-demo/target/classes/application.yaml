spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mp?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
logging:
  level:
    com.itheima: debug
  pattern:
    dateformat: HH:mm:ss
#mybatis:
#  mapper-locations: classpath*:mapper/*.xml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

  type-aliases-package: com.itheima.mp.domain.po
  configuration:
    map-underscore-to-camel-case: true
    dafault-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
knife4j:
    enable: true  #开启swagger
    openapi:
      title: 用户接口管理
      description: 用户接口管理
      version: 1.0.0
      concat: 黑马
      group:
        default:
          group-name: default
          api-rule: package
          api-rule-resources:
            - com.itheima.mp.controller

